<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZHServer Admin</title>

    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="admin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<section class="section dark">

    <div class="container">

        <span class="section-title">
            ZHSERVER ADMIN
        </span>

        <h2>Kontrollzentrum</h2>

        <div class="cards">

            <div class="card admin-card">

                <i class="fa-solid fa-book archive-icon"></i>

                <h3>Gästebuch</h3>

                <p>
                    Ausstehende Gästebucheinträge prüfen,
                    freigeben oder löschen.
                </p>

            </div>

            <div class="card admin-card">

                <i class="fa-regular fa-images archive-icon"></i>

                <h3>Screenshots</h3>

                <p>
                    Neue Uploads der Community
                    verwalten und veröffentlichen.
                </p>

            </div>

            <div class="card admin-card">

                <i class="fa-solid fa-newspaper archive-icon"></i>

                <h3>News</h3>

                <p>
                    Historische Beiträge
                    bearbeiten oder ergänzen.
                </p>

            </div>

            <div class="card admin-card">

                <i class="fa-solid fa-chart-line archive-icon"></i>

                <h3>Statistik</h3>

                <p>
                    Besucherzahlen und
                    Archivinformationen.
                </p>

            </div>

        </div>

    </div>

</section>

<script src="admin.js"></script>

</body>
</html>
