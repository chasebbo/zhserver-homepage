<!DOCTYPE html>
<html lang="de">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZHServer Admin</title>

    <link rel="stylesheet" href="../assets/css/style.css?v=20260812-ui2">
    <link rel="stylesheet" href="admin.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body>

<section class="section dark">

    <div class="container login-container">

        <span class="section-title">
            ZHSERVER ADMIN
        </span>

        <h2>Anmeldung</h2>

        <div class="card login-card">

            <input
                type="email"
                id="email"
                placeholder="E-Mail">

            <input
                type="password"
                id="password"
                placeholder="Passwort">

            <button id="loginBtn" class="btn">
                Anmelden
            </button>

            <p id="loginMessage"></p>

        </div>

    </div>

</section>

<script src="admin.js"></script>

</body>
</html>
